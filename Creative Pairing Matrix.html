<!-- Creative Pairing Matrix — progetto ideato e curato da Gabry -->
<title>Creative Pairing Matrix</title>
<style>
/* Notte in osteria (sfondo alleggerito) + font di sistema (nessuna richiesta di rete: funziona offline), caratteri ingranditi */
:root{
  --ink:#F2E9DD;
  --ink-soft:#D2A868;
  --paper:#2C2620;
  --card:#3A332B;
  --line:rgba(242,233,221,0.16);
  --strada:#E8A33D;
  --strada-soft:#4E3A22;
  --trattoria:#D2B25C;
  --trattoria-soft:#453A22;
  --stellato:#D9829A;
  --stellato-soft:#45303A;
  --shadow: 0 1px 3px rgba(0,0,0,0.45);
  --font-display:'Noteworthy', 'Bradley Hand', 'Comic Sans MS', cursive;
  --font-body:-apple-system, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;}
html{font-size:118%;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:84px;
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding:20px 18px 8px;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
a{color:inherit;}
button{font-family:var(--font-body);color:inherit;background:none;border:none;-webkit-appearance:none;appearance:none;cursor:pointer;}

/* ---------- header ---------- */
.top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}
.top h1{
  font-size:1.5rem;
  letter-spacing:-0.01em;
}
.top .sub{
  font-size:0.72rem;
  color:var(--ink);
  margin-top:2px;
}
.count-badge{
  font-size:0.68rem;
  color:var(--ink-soft);
  white-space:nowrap;
  border:1px solid var(--line);
  border-radius:20px;
  padding:4px 10px;
}

/* ---------- search ---------- */
.search-box{
  position:relative;
  margin-bottom:14px;
}
.search-box input{
  width:100%;
  font-family:var(--font-body);
  font-size:1rem;
  padding:13px 16px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  outline:none;
}
.search-box input:focus{border-color:var(--strada);}
.search-box input::placeholder{color:var(--ink-soft);}

.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:6px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  font-size:0.78rem;
  padding:7px 13px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  white-space:nowrap;
}
.chip.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

/* ---------- tabs (Cerca / Combinatore) ---------- */
.maintabs{
  display:flex;
  gap:0;
  margin-bottom:16px;
  border-bottom:1px solid var(--line);
}
.maintab{
  flex:1;
  text-align:center;
  padding:10px 4px;
  font-size:0.86rem;
  font-weight:600;
  color:var(--ink-soft);
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.maintab.active{color:var(--ink);border-bottom-color:var(--strada);}

/* ---------- food list ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.foodrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 14px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--line);
  text-align:left;
  width:100%;
}
.foodrow .name{font-family:var(--font-display);font-size:1.18rem;font-weight:600;}
.foodrow .meta{font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
.foodrow .arrow{color:var(--ink-soft);font-size:1.1rem;flex:0 0 auto;}
.section-label{
  font-size:0.72rem;
  color:var(--ink-soft);
  margin:18px 0 8px 2px;
}
.empty-msg{
  color:var(--ink-soft);
  font-size:0.88rem;
  padding:30px 10px;
  text-align:center;
}
.surprise-btn{
  display:block;
  width:100%;
  padding:12px;
  margin-top:16px;
  border-radius:12px;
  border:1px dashed var(--line);
  background:none;
  color:var(--ink-soft);
  font-size:0.85rem;
}

/* ---------- detail view ---------- */
.backbtn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:none;
  background:none;
  color:var(--ink-soft);
  font-size:0.85rem;
  padding:6px 0;
  margin-bottom:10px;
}
.detail-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px 20px 8px;
  margin-bottom:16px;
}
.detail-macro{
  font-size:0.72rem;
  color:var(--ink-soft);
}
.detail-name{
  font-family:var(--font-display);
  font-size:1.85rem;
  line-height:1.15;
  margin:4px 0 10px;
}
.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  font-size:0.78rem;
  color:var(--ink);
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.detail-meta b{color:var(--ink-soft);font-weight:600;}
.profilo-line{
  font-size:0.92rem;
  font-style:italic;
  color:var(--ink);
  margin-bottom:14px;
  line-height:1.4;
}
.classici-wrap{margin-bottom:16px;}
.pair-chips{display:flex;flex-wrap:wrap;gap:6px;}
.pair-chip{
  font-size:0.76rem;
  padding:5px 11px;
  border-radius:20px;
  background:var(--paper);
  border:1px solid var(--line);
}
.fav-btn{
  position:absolute;
  top:16px;
  right:16px;
  background:none;
  border:none;
  font-size:1.3rem;
  line-height:1;
  color:var(--ink-soft);
}
.fav-btn.active{color:var(--strada);}
.detail-card{position:relative;}

.level-panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px 18px;
  margin-bottom:16px;
}
.level-title{
  font-size:0.72rem;
  color:var(--ink-soft);
  margin-bottom:10px;
}
.proposta{
  font-size:0.92rem;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.proposta:last-child{border-bottom:none;}
.tecnica-tag{
  display:inline-block;
  margin-top:8px;
  font-size:0.7rem;
  color:var(--ink-soft);
}
.creativo-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
  font-size:0.86rem;
}
.creativo-box .lbl{font-size:0.7rem;color:var(--ink-soft);display:block;margin-bottom:3px;}
.world-row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.world-row:last-child{border-bottom:none;}
.world-region{
  font-family:var(--font-display);
  font-size:0.86rem;
  font-weight:600;
  color:var(--strada);
  margin-bottom:2px;
}
.world-abb{font-size:0.9rem;margin-bottom:2px;}
.world-tec{font-size:0.76rem;color:var(--ink-soft);}

/* ---------- combinatore ---------- */
.combi-slot{margin-bottom:12px;}
.combi-slot label{
  display:block;
  font-size:0.72rem;
  color:var(--ink-soft);
  margin-bottom:5px;
}
.combi-input-wrap{position:relative;}
.combi-input-wrap input{
  width:100%;
  font-family:var(--font-body);
  font-size:0.96rem;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  outline:none;
}
.combi-dropdown{
  position:absolute;
  left:0;right:0;top:calc(100% + 4px);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  max-height:220px;
  overflow-y:auto;
  z-index:10;
  box-shadow:0 6px 18px rgba(0,0,0,0.14);
  display:none;
}
.combi-dropdown.show{display:block;}
.combi-opt{
  padding:10px 14px;
  font-size:0.88rem;
  border-bottom:1px solid var(--line);
}
.combi-opt:last-child{border-bottom:none;}
.combi-opt .m{font-size:0.68rem;color:var(--ink-soft);}
.swap-btn{
  display:block;
  margin:0 auto 12px;
  background:none;
  border:1px solid var(--line);
  border-radius:50%;
  width:34px;height:34px;
  color:var(--ink-soft);
  font-size:0.9rem;
}
.abbina-btn{
  display:block;
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:var(--ink);
  color:var(--paper);
  font-size:0.95rem;
  font-weight:600;
  margin-top:6px;
}
.abbina-btn:disabled{opacity:0.4;}
.result-card{
  margin-top:20px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}
.verdict{
  display:inline-block;
  font-size:0.74rem;
  font-weight:600;
  padding:5px 12px;
  border-radius:20px;
  margin-bottom:12px;
}
.verdict.naturale{background:var(--trattoria-soft);color:var(--trattoria);}
.verdict.audace{background:var(--strada-soft);color:var(--strada);}
.verdict.sperimentale{background:var(--stellato-soft);color:var(--stellato);}
.result-pair{font-family:var(--font-display);font-size:1.5rem;font-weight:600;margin-bottom:8px;line-height:1.25;}
.result-explain{font-size:0.9rem;line-height:1.5;color:var(--ink);margin-bottom:14px;}
.result-tec{
  font-size:0.85rem;
  background:var(--paper);
  border-radius:10px;
  padding:10px 12px;
}
.result-tec b{display:block;font-size:0.68rem;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--line);
  display:flex;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index:20;
}
.navbtn{
  flex:1;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:0.68rem;
  padding:8px 2px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.navbtn .ic{font-size:1.15rem;}
.navbtn.active{color:var(--strada);}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>

  nav: 'search',
  query: '',
  macroFilter: null,
  selectedId: null,
  combiA: null,
  combiB: null,
};

  if(raw) favorites = new Set(JSON.parse(raw));
}catch(e){}

  try{ localStorage.setItem('abbinamenti_favoriti', JSON.stringify([...favorites])); }catch(e){}
}

const byId = {};
FOODS.forEach(f => byId[f.id] = f);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function norm(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function render(){
  const app = document.getElementById('app');
  if(state.nav === 'search' && !state.selectedId) app.innerHTML = renderSearch();
  else if(state.nav === 'search' && state.selectedId) app.innerHTML = renderDetail(byId[state.selectedId]);
  else if(state.nav === 'combinatore') app.innerHTML = renderCombinatore();
  else if(state.nav === 'preferiti') app.innerHTML = renderPreferiti();
  attachHandlers();
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav === state.nav);
  });
  window.scrollTo(0,0);
}

function renderSearch(){
  let results = [];
  const q = norm(state.query.trim());
  if(q.length > 0){
    results = FOODS.filter(f => norm(f.nome).includes(q));
    if(state.macroFilter) results = results.filter(f => f.macro === state.macroFilter);
    results = results.slice(0, 120);
  } else if(state.macroFilter){
    results = FOODS.filter(f => f.macro === state.macroFilter).slice(0, 200);
  }

  const chips = MACROS.map(m => `
    <button class="chip ${state.macroFilter===m.macro?'active':''}" data-macro="${escapeHtml(m.macro)}">
      ${escapeHtml(m.macro)} <span style="opacity:.6">${m.count}</span>
    </button>`).join('');

  let listHtml;
  if(results.length){
    listHtml = `<div class="list">` + results.map(rowHtml).join('') + `</div>`;
  } else if(q.length > 0 || state.macroFilter){
    listHtml = `<div class="empty-msg">Nessun alimento trovato. Prova un altro nome o categoria.</div>`;
  } else {
    listHtml = `<div class="empty-msg">Scrivi il nome di un alimento, oppure scegli una categoria qui sopra.</div>`;
  }

  return `
    <div class="top">
      <div>
        <h1>Creative Pairing Matrix</h1>
        <div class="sub">from Gabry for Chef Luca Bellanca</div>
      </div>
      <div class="count-badge">${FOODS.length} alimenti</div>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" inputmode="search" autocomplete="off"
        placeholder="Cerca un alimento…" value="${escapeHtml(state.query)}">
    </div>
    <div class="chips" id="chipRow">${chips}</div>
    ${listHtml}
    <button class="surprise-btn" id="surpriseBtn">Sorprendimi con un abbinamento a caso</button>
  `;
}

function rowHtml(f){
  const isFav = favorites.has(f.id);
  return `
    <button class="foodrow" data-id="${f.id}">
      <div>
        <div class="name">${escapeHtml(f.nome)}${isFav ? ' &#9733;' : ''}</div>
        <div class="meta">${escapeHtml(f.macro)} · ${escapeHtml(f.sub)}</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </button>`;
}

function renderDetail(f){
  const isFav = favorites.has(f.id);
  const n = Math.min(f.pairing.length, f.tecniche.length);
  const proposteHtml = Array.from({length:n}, (_,j) =>
    `<div class="proposta">${escapeHtml(f.pairing[j])} — tecnica: ${escapeHtml(f.tecniche[j])}</div>`
  ).join('');
  const creativoHtml = f.creativo ? `
    <div class="creativo-box">
      <span class="lbl">Abbinamento creativo / moderno</span>
      ${escapeHtml(f.creativo)}
    </div>` : '';

  const worldList = WORLD[f.sub] || WORLD[f.macro] || [];
  const worldHtml = worldList.length ? `
    <div class="level-panel">
      <div class="level-title">Abbinamenti dal mondo</div>
      ${worldList.map(w => `
        <div class="world-row">
          <div class="world-region">${escapeHtml(w.regione)}</div>
          <div class="world-abb">${escapeHtml(f.nome)}, ${escapeHtml(w.abbinamento)}</div>
          <div class="world-tec">${escapeHtml(w.tecnica)}</div>
        </div>
      `).join('')}
    </div>` : '';

  return `
    <button class="backbtn" id="backBtn">&larr; Torna alla ricerca</button>
    <div class="detail-card">
      <button class="fav-btn ${isFav?'active':''}" id="favBtn">${isFav?'&#9733;':'&#9734;'}</button>
      <div class="detail-macro">${escapeHtml(f.macro)} &middot; ${escapeHtml(f.sub)}</div>
      <div class="detail-name">${escapeHtml(f.nome)}</div>
      <div class="detail-meta">
        <span><b>Stagione</b> ${escapeHtml(f.stagione)}</span>
        <span><b>Periodo</b> ${escapeHtml(f.periodo)}</span>
        ${f.provenienza !== f.periodo ? `<span><b>Provenienza</b> ${escapeHtml(f.provenienza)}</span>` : ''}
      </div>
      <div class="profilo-line">${escapeHtml(f.profilo)}</div>
      <div class="classici-wrap">
        <div class="section-label" style="margin-top:0;">Abbinamenti classici</div>
        <div class="pair-chips">
          ${f.pairing.map(p=>`<span class="pair-chip">${escapeHtml(p)}</span>`).join('')}
        </div>
      </div>
      <div class="classici-wrap">
        <div class="section-label">Tecniche / preparazioni</div>
        <div class="pair-chips">
          ${f.tecniche.map(t=>`<span class="pair-chip">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="level-panel">
      <div class="level-title">5 proposte rapide</div>
      ${proposteHtml}
      ${creativoHtml}
    </div>
    ${worldHtml}
  `;
}

function renderPreferiti(){
  const list = FOODS.filter(f => favorites.has(f.id));
  const html = list.length
    ? `<div class="list">${list.map(rowHtml).join('')}</div>`
    : `<div class="empty-msg">Nessun preferito ancora. Tocca la stella su un alimento per salvarlo qui.</div>`;
  return `
    <div class="top">
      <div><h1>Preferiti</h1><div class="sub">i tuoi abbinamenti salvati · Creative Pairing Matrix from Gabry for Chef Luca Bellanca</div></div>
    </div>
    ${html}
  `;
}

function renderCombinatore(){
  const a = state.combiA ? byId[state.combiA] : null;
  const b = state.combiB ? byId[state.combiB] : null;
  const canGo = a && b;

  return `
    <div class="top">
      <div><h1>Combinatore</h1><div class="sub">abbina due alimenti qualsiasi dell'archivio · Creative Pairing Matrix from Gabry for Chef Luca Bellanca</div></div>
    </div>

    <div class="combi-slot">
      <label>Primo alimento</label>
      <div class="combi-input-wrap">
        <input id="combiInputA" type="text" autocomplete="off" placeholder="Cerca…"
          value="${a ? escapeHtml(a.nome) : ''}">
        <div class="combi-dropdown" id="dropdownA"></div>
      </div>
    </div>

    <button class="swap-btn" id="swapBtn" title="Scambia">&#8645;</button>

    <div class="combi-slot">
      <label>Secondo alimento</label>
      <div class="combi-input-wrap">
        <input id="combiInputB" type="text" autocomplete="off" placeholder="Cerca…"
          value="${b ? escapeHtml(b.nome) : ''}">
        <div class="combi-dropdown" id="dropdownB"></div>
      </div>
    </div>

    <button class="abbina-btn" id="abbinaBtn" ${canGo?'':'disabled'}>Abbina</button>

    <div id="combiResult"></div>
  `;
}

function combineScore(a, b){
  const aP = new Set(a.ptags||[]), aB = new Set(a.btags||[]);
  const bP = new Set(b.ptags||[]), bB = new Set(b.btags||[]);
  const bridgeMatches = [...aB].filter(t => bP.has(t)).concat([...bB].filter(t => aP.has(t)));
  const profileMatches = [...aP].filter(t => bP.has(t));
  const sameMacro = a.macro === b.macro;
  const score = bridgeMatches.length*2 + profileMatches.length*1 + (sameMacro?0.5:0);
  return {score, bridgeMatches:[...new Set(bridgeMatches)], profileMatches:[...new Set(profileMatches)], sameMacro};
}

function renderCombiResult(a, b){
  const r = combineScore(a, b);
  let verdictClass, verdictLabel, explain;
  if(r.bridgeMatches.length >= 2){
    verdictClass='naturale'; verdictLabel='Abbinamento naturale';
    explain = `I ponti aromatici dei due alimenti si incontrano su ${r.bridgeMatches.map(t=>`<b>${t}</b>`).join(', ')}: una combinazione solida, quasi scontata in cucina, che raramente delude.`;
  } else if(r.bridgeMatches.length === 1 || r.profileMatches.length >= 2){
    verdictClass='audace'; verdictLabel='Abbinamento audace';
    const tags = r.bridgeMatches.length ? r.bridgeMatches : r.profileMatches;
    explain = `Il legame passa per ${tags.map(t=>`<b>${t}</b>`).join(', ')}: non è la scelta più ovvia, ma regge bene se la tecnica valorizza questo punto di contatto.`;
  } else if(r.profileMatches.length === 1){
    verdictClass='audace'; verdictLabel='Abbinamento da bilanciare';
    explain = `Condividono solo la nota <b>${r.profileMatches[0]}</b>: serve un elemento ponte (un grasso, un acido o un'erba) per far dialogare i due profili.`;
  } else {
    verdictClass='sperimentale'; verdictLabel='Sperimentale';
    explain = `Non condividono note aromatiche dirette: è un accostamento da laboratorio, il tipo di contrasto che i cuochi più creativi usano per sorprendere. Da testare in piccola quantità.`;
  }

  const allTech = [...new Set([...a.tecniche, ...b.tecniche])].slice(0,4);

  return `
    <div class="result-card">
      <span class="verdict ${verdictClass}">${verdictLabel}</span>
      <div class="result-pair">${escapeHtml(a.nome)} + ${escapeHtml(b.nome)}</div>
      <div class="result-explain">${explain}</div>
      <div class="result-tec">
        <b>Tecniche consigliate</b>
        ${allTech.map(escapeHtml).join(', ')}
      </div>
    </div>
  `;
}

function attachHandlers(){
  // bottom nav
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.onclick = () => {
      state.nav = b.dataset.nav;
      state.selectedId = null;
      render();
    };
  });

  // ---- search view ----
  const si = document.getElementById('searchInput');
  if(si){
    si.oninput = (e) => { state.query = e.target.value; render(); si2Focus(); };
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  }
  const chipRow = document.getElementById('chipRow');
  if(chipRow){
    chipRow.querySelectorAll('.chip').forEach(c=>{
      c.onclick = () => {
        const m = c.dataset.macro;
        state.macroFilter = (state.macroFilter === m) ? null : m;
        render();
      };
    });
  }
  document.querySelectorAll('.foodrow').forEach(r=>{
    r.onclick = () => {
      state.selectedId = parseInt(r.dataset.id, 10);
      render();
    };
  });
  const surpriseBtn = document.getElementById('surpriseBtn');
  if(surpriseBtn){
    surpriseBtn.onclick = () => {
      const f = FOODS[Math.floor(Math.random()*FOODS.length)];
      state.selectedId = f.id;
      render();
    };
  }

  // ---- detail view ----
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = () => { state.selectedId = null; render(); };
  const favBtn = document.getElementById('favBtn');
  if(favBtn) favBtn.onclick = () => {
    if(favorites.has(state.selectedId)) favorites.delete(state.selectedId);
    else favorites.add(state.selectedId);
    saveFavorites();
    render();
  };

  if(state.nav === 'preferiti'){
    document.querySelectorAll('.foodrow').forEach(r=>{
      r.onclick = () => {
        state.nav = 'search';
        state.selectedId = parseInt(r.dataset.id, 10);
        render();
      };
    });
  }

  // ---- combinatore view ----
  setupCombiInput('combiInputA','dropdownA','combiA');
  setupCombiInput('combiInputB','dropdownB','combiB');
  const swapBtn = document.getElementById('swapBtn');
  if(swapBtn) swapBtn.onclick = () => {
    const tmp = state.combiA; state.combiA = state.combiB; state.combiB = tmp;
    render();
  };
  const abbinaBtn = document.getElementById('abbinaBtn');
  if(abbinaBtn){
    abbinaBtn.onclick = () => {
      const a = byId[state.combiA], b = byId[state.combiB];
      if(!a || !b) return;
      document.getElementById('combiResult').innerHTML = renderCombiResult(a, b);
    };
  }
}

function si2Focus(){
  requestAnimationFrame(()=>{
    const el = document.getElementById('searchInput');
    if(el) el.focus();
  });
}

function setupCombiInput(inputId, dropdownId, stateKey){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if(!input || !dropdown) return;

  function showMatches(q){
    const nq = norm(q.trim());
    if(nq.length === 0){ dropdown.classList.remove('show'); dropdown.innerHTML=''; return; }
    const matches = FOODS.filter(f => norm(f.nome).includes(nq)).slice(0, 40);
    if(!matches.length){ dropdown.classList.remove('show'); dropdown.innerHTML=''; return; }
    dropdown.innerHTML = matches.map(f => `
      <div class="combi-opt" data-id="${f.id}">
        ${escapeHtml(f.nome)}<div class="m">${escapeHtml(f.macro)}</div>
      </div>`).join('');
    dropdown.classList.add('show');
    dropdown.querySelectorAll('.combi-opt').forEach(o=>{
      o.onclick = () => {
        state[stateKey] = parseInt(o.dataset.id, 10);
        dropdown.classList.remove('show');
        render();
      };
    });
  }

  input.oninput = (e) => showMatches(e.target.value);
  input.onfocus = (e) => showMatches(e.target.value);
  input.addEventListener('blur', () => {
    setTimeout(()=> dropdown.classList.remove('show'), 150);
  });
}

render();
</script>
</body>
</html>
